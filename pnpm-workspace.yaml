allowBuilds:
  '@swc/core': true
  bufferutil: true
  es5-ext: true
  esbuild: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@polymeshassociation/polymesh-types@7.8.0'
# Keep one @polkadot stack, matching @polymeshassociation/polymesh-sdk (api 16.5.2, util 13.5.9).
# The signing manager's extension-inject accepts any 16.x and would otherwise pull
# @polkadot/types 16.5.6, which brings in @polkadot/util 14.
overrides:
  '@polkadot/types': 16.5.2
  '@polkadot/types-augment': 16.5.2
  '@polkadot/types-codec': 16.5.2
  '@polkadot/types-create': 16.5.2
  '@polkadot/types-known': 16.5.2
  '@polkadot/rpc-provider': 16.5.2
  '@polkadot/rpc-core': 16.5.2
  '@polkadot/rpc-augment': 16.5.2
